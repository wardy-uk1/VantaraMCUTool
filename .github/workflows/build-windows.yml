name: Build Windows executable

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows build
        run: dotnet publish VantaraMCUTool.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:DebugType=None

      - name: Package executable
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Path "publish\*" -Destination $dist -Recurse -Force
          $archive = "VantaraMCUTool-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path "publish\*" -DestinationPath (Join-Path $dist $archive) -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantaraMCUTool-${{ github.sha }}-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90

  attach-to-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: VantaraMCUTool-${{ github.sha }}-win-x64
          path: dist

      - name: Attach Windows package to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VantaraMCUTool-*-win-x64.zip